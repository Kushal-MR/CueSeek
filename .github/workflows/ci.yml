name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than pinning it here, so there is one
          # place to change it.
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # ---------------------------------------------------------------------------
      # The contract-drift gate. This is the job that makes ADR-0009 real.
      #
      # api/openapi.yaml is the single source of truth; the Go server interfaces are
      # generated from it. Regenerating and then failing on any diff means the two
      # cannot silently disagree. Without this step, "spec-first" is a convention
      # maintained by discipline — and conventions lose to whichever file is faster to
      # edit under deadline.
      #
      # It also catches the subtler direction: a hand-edit to generated code. Those
      # survive review easily and are erased by the next regeneration, taking whatever
      # behaviour depended on them with it.
      # ---------------------------------------------------------------------------
      - name: Regenerate from the contract
        working-directory: agent
        run: go generate ./...

      - name: Fail if generated code has drifted from the contract
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code does not match api/openapi.yaml."
            echo "::error::Run 'cd agent && go generate ./...' and commit the result."
            exit 1
          fi

      - name: gofmt
        working-directory: agent
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: agent
        run: go vet ./...

      - name: Test
        working-directory: agent
        run: go test -race ./...

      - name: Build
        working-directory: agent
        run: go build ./...

      # The agent is developed on Windows and deployed to Linux. Building only for the
      # host would let a Linux-only regression reach the target undetected — and once
      # the D-Bus host layer lands, that is exactly where platform-specific code lives.
      - name: Cross-compile for the deployment target
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o /tmp/cueseekd ./cmd/cueseekd

  # ---------------------------------------------------------------------------------
  # The Android client. Until now nothing in CI compiled it, and the scaffold committed
  # in c836142 did not in fact build: its androidx versions required AGP 9.1+ and
  # compileSdk 37 against an AGP 9.0.1 / compileSdk 36 project. A build that nothing runs
  # is a build that is already broken and not yet known to be.
  #
  # `build` is deliberately the whole of it — assemble, unit tests and lint for every
  # module. Instrumented tests need an emulator and are not worth the CI minutes until
  # there is UI to instrument (M2 phase P5).
  # ---------------------------------------------------------------------------------
  android:
    name: Android client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is committed, so its checksum is worth verifying: it is executable
      # code that runs before any of our own build logic does.
      - uses: gradle/actions/wrapper-validation@v4

      # 21, not 17. Paparazzi 2.0.0-alpha05's Gradle module metadata declares
      # `org.gradle.jvm.version: 21` on both apiElements and runtimeElements, so a Java 17
      # runner cannot even resolve the plugin - the build fails while configuring
      # :core:design, before any code is compiled.
      #
      # This was invisible locally: the development machine's default JDK is 25 and Android
      # Studio's JBR is 25, so the floor was never touched. It only appeared once CI, the
      # one environment pinned to 17, ran the design system for the first time.
      #
      # The modules still target JVM 17 bytecode; that is a compile target and is unaffected
      # by the runtime the build itself runs on.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # -------------------------------------------------------------------------------
      # No SDK installation step, and no setup-android action.
      #
      # The first version of this job ran `sdkmanager "platforms;android-37"` and failed
      # with "Failed to find package". That package has never existed: Android now
      # versions platforms by major *and minor*, so the ids are `android-36.1`,
      # `android-37.0`, `android-37.1`. Only `repository2-3.xml` lists them at all —
      # `repository2-1.xml` and `repository2-2.xml`, which older sdkmanager builds read,
      # still stop at `android-36`. Correcting the id alone would therefore have swapped
      # one failure for a dependency on which cmdline-tools version the action installed.
      #
      # None of it is needed. The ubuntu-latest image already ships android-37.0 and
      # android-37.1, build-tools 37.0.0 and 36.x, and ANDROID_HOME. AGP downloads what
      # it lacks through its own resolver, not through sdkmanager — verified locally,
      # where the SDK has no cmdline-tools at all and the build succeeds regardless.
      #
      # What is kept is the intent of the original step: fail here, legibly, rather than
      # somewhere inside a Gradle task graph. The check matches `android-37*` rather than
      # an exact minor, because which minor `compileSdk release(37)` resolves to is AGP's
      # decision and duplicating it here is how this file goes stale again.
      # -------------------------------------------------------------------------------
      - name: Check the runner provides a compile SDK
        working-directory: .
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          if ! ls -d "$ANDROID_HOME"/platforms/android-37* >/dev/null 2>&1; then
            echo "::error::The runner image has no android-37 platform."
            echo "::error::Platforms are minor-versioned: expect android-37.0, not android-37."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4

      # -------------------------------------------------------------------------------
      # The client's half of the contract-drift gate, and the reason ADR-0009's claim is
      # tested rather than asserted: the same property is now enforced in two languages.
      #
      # Types are generated and committed; the calls are hand-written (ADR-0004
      # Amendment 3). This step regenerates the types and fails on any diff, so the app
      # cannot disagree with api/openapi.yaml about the shape of what crosses the wire,
      # and a hand-edit to generated code cannot survive review.
      # -------------------------------------------------------------------------------
      - name: Regenerate the wire types from the contract
        run: ./gradlew :core:api:generateApiTypes

      - name: Fail if generated types have drifted from the contract
        working-directory: .
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated wire types do not match api/openapi.yaml."
            echo "::error::Run 'cd clients/android && ./gradlew :core:api:generateApiTypes' and commit the result."
            exit 1
          fi

      - name: Build, test and lint every module
        run: ./gradlew build

      # `check` does not include Paparazzi verification - it only prepares its resources -
      # so a golden would drift silently if this were left to `build`. The status language
      # is the one part of the UI where a rendering change is a correctness bug, which is
      # why it is pinned at all (ADR-0010).
      - name: Verify the design system's golden images
        run: ./gradlew :core:design:verifyPaparazziDebug
