name: Release

# Cutting a release is pushing a tag. Nothing else publishes anything.
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# workflow_dispatch builds the same artefacts and attaches them to the workflow run instead
# of publishing them, so the pipeline can be exercised without spending a version number on
# finding out that it is broken.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: Agent
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading to it.
      contents: write
      # Build provenance. SECURITY.md's case rests on the operator being able to check what
      # CueSeek is, and an unsigned binary that can power off a machine is a lot to ask
      # somebody to take on trust. An attestation ties this artefact to this workflow, this
      # commit and this runner, and `gh attestation verify` checks it without trusting the
      # release page.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history, because the build stamps a version derived from them and a
          # shallow clone would silently produce `0.0.0-dev` — which is exactly the failure
          # mode M4.5b was about: a binary that cannot say which build it is.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # ---------------------------------------------------------------------------
      # Nothing is published that has not passed the same gates as a pull request.
      #
      # CI already runs these on every PR, so on a tag pushed from a green main they will
      # pass again. That is the point: the cost is two minutes, and the thing it prevents
      # is a tag cut from a commit that was never actually green — a mistake that is
      # invisible until somebody installs it.
      # ---------------------------------------------------------------------------
      - name: Test
        working-directory: agent
        run: go test -race ./...

      - name: Vet
        working-directory: agent
        run: go vet ./...

      - name: Check the ADR index against the records
        run: ./scripts/check-adr-index.sh

      # ---------------------------------------------------------------------------
      # The build. Every flag lives in the script, not here, so that a release built by
      # hand and one built by CI are the same bytes produced the same way.
      # ---------------------------------------------------------------------------
      - name: Determine the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

      - name: Build the release tarball
        run: ./scripts/release-agent.sh -v "${{ steps.version.outputs.version }}"

      - name: Show what was built
        run: |
          ls -l dist/
          cat dist/SHA256SUMS
          tar -tvzf dist/*.tar.gz

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      # A dry run keeps its artefacts on the workflow run and publishes nothing.
      - name: Upload artefacts (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cueseek-agent-${{ steps.version.outputs.version }}
          path: dist/

      # ---------------------------------------------------------------------------
      # Publish. `gh` rather than a third-party action: it is preinstalled on the runner,
      # and the fewer things with write access to releases the better on a project whose
      # security story is that you can read everything it does.
      #
      # A tag containing a hyphen (v0.2.0-rc1) is marked prerelease, so that "latest" never
      # points at something that was not meant to be.
      # ---------------------------------------------------------------------------
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac

          cat > notes.md <<'NOTES'
          ## Install

          ```bash
          tar xzf cueseek-agent_*_linux_amd64.tar.gz
          cd cueseek-agent_*_linux_amd64
          sudo ./install.sh
          ```

          The tarball is self-contained: the agent, the systemd unit, the polkit rule, the
          annotated example configuration, and the installer. No clone needed.

          Verify the download before extracting it:

          ```bash
          sha256sum -c SHA256SUMS
          ```

          And confirm it came from this workflow rather than from the release page alone:

          ```bash
          gh attestation verify cueseek-agent_*_linux_amd64.tar.gz --repo ${{ github.repository }}
          ```

          That needs GitHub CLI **2.49 or later**. Ubuntu 24.04 ships 2.45, which has no
          `attestation` command — run it from a machine with a newer `gh` rather than
          concluding the artefact is unverifiable.

          After installing, `sudo cueseekd check` reports whether the configuration, the
          polkit allowlist and the units actually agree.

          ## The Android client

          `cueseek_*.apk` is attached when a signing key is configured. Sideload it, then
          pair with the code from `sudo -u cueseek cueseekd pair`.

          It installs as `dev.cueseek.android`. A build made from source installs as
          `dev.cueseek.android.debug` and the two coexist, so a development build never
          displaces the one you rely on.

          **Signed with a key that is not Google Play's.** If you have previously installed
          a build of CueSeek made from source under the release application id, Android will
          refuse to install this over it and you will have to uninstall first — which clears
          the stored token and means pairing again, once.

          ## Supported

          **Linux with systemd and polkit 0.106 or later, on `linux/amd64`.** Developed and
          tested on Linux Mint 22.3 with systemd 255 and polkit 124, over Tailscale.

          Other distributions should work and are untested. There is no `arm64` build: it
          cannot be tested here, and this project does not ship architectures it has not
          run. NAS appliances are not supported — `install.sh` refuses rather than
          half-installing.

          Jellyfin and qBittorrent are supported in full. Any other systemd unit is
          supported for health and lifecycle control through `type: systemd`.

          The agent is not built to be exposed to the internet. See
          [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md).
          NOTES

          gh release create "$VERSION" \
            dist/*.tar.gz dist/SHA256SUMS \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes \
            $prerelease

  # -----------------------------------------------------------------------------------
  # The Android client.
  #
  # A separate job, after the agent, because it needs the release to exist before it can
  # attach to it — and because a missing Android signing key must not stop the agent from
  # being published. The two halves ship independently by design (ADR-0004): a client four
  # milestones behind a v0.1.0 agent was observed working, so an APK that lags a release is
  # a normal state rather than a broken one.
  # -----------------------------------------------------------------------------------
  android:
    name: Android client
    runs-on: ubuntu-latest
    needs: agent
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      # Publishing an unsigned APK would be worse than publishing none: it cannot be
      # installed, and its presence on a release page implies otherwise. So the job reports
      # what it is about to do and stops here if it cannot sign.
      - name: Is a signing key configured?
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, so no APK will be published. The agent release is unaffected."
          fi

      # A pre-release shares its versionCode with the final release of the same number
      # (see app/build.gradle.kts), so Android would refuse to upgrade one to the other.
      # Publishing the agent for a release candidate is useful; publishing an APK that
      # strands whoever installs it is not.
      - name: Should an APK be published for this tag?
        id: gate
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            case "$VERSION" in
              *-*) echo "publish=false" >> "$GITHUB_OUTPUT"
                   echo "::notice::$VERSION is a pre-release; APK skipped (versionCode would collide with the final release)." ;;
              *)   echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/cueseek.jks"
          # Never echoed, and outside the workspace so no later step can archive it by
          # accident. The runner is ephemeral; the shred below is belt and braces.
          echo "::add-mask::$(sha256sum "${RUNNER_TEMP}/cueseek.jks" | cut -d' ' -f1)"

      - name: Build the release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: clients/android
        env:
          CUESEEK_VERSION: ${{ github.event_name == 'push' && github.ref_name || '' }}
          CUESEEK_KEYSTORE: ${{ runner.temp }}/cueseek.jks
          CUESEEK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CUESEEK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CUESEEK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # An unsigned output here means the signing configuration was not picked up — which
      # would otherwise be discovered by whoever downloaded it and could not install it.
      - name: Verify the APK is signed, and name what it is
        if: steps.signing.outputs.available == 'true'
        working-directory: clients/android
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK at $apk. An unsigned build produces app-release-unsigned.apk."
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi

          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -E "^package"

          mkdir -p "${GITHUB_WORKSPACE}/apk"
          version="$("$build_tools/aapt2" dump badging "$apk" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          cp "$apk" "${GITHUB_WORKSPACE}/apk/cueseek_${version}.apk"
          ( cd "${GITHUB_WORKSPACE}/apk" && sha256sum ./*.apk > SHA256SUMS-apk )
          ls -l "${GITHUB_WORKSPACE}/apk"

      - name: Shred the keystore
        if: always() && steps.signing.outputs.available == 'true'
        run: shred -u "${RUNNER_TEMP}/cueseek.jks" 2>/dev/null || rm -f "${RUNNER_TEMP}/cueseek.jks"

      - uses: actions/attest-build-provenance@v2
        if: steps.signing.outputs.available == 'true' && steps.gate.outputs.publish == 'true'
        with:
          subject-path: apk/*.apk

      - name: Upload the APK (dry run)
        if: steps.signing.outputs.available == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cueseek-apk
          path: apk/

      - name: Attach the APK to the release
        if: steps.signing.outputs.available == 'true' && steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" apk/*.apk apk/SHA256SUMS-apk --clobber
