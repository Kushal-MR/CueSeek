# =============================================================================
# CueSeek API — the contract.
#
# HAND-AUTHORED, and the single source of truth for the agent and every client.
# Go server interfaces and all client SDKs are GENERATED FROM IT. Never generate
# this file from handler code: a spec derived from an implementation is a
# description, not a contract. CI regenerates and fails on drift. See ADR-0004
# and ADR-0009.
#
# Regenerate:  cd agent && go generate ./...
# =============================================================================
openapi: 3.0.3

info:
  title: CueSeek Agent API
  version: 0.1.0
  description: |
    The API exposed by `cueseekd`, the CueSeek host agent.

    ## Transport and exposure

    This API is **not designed to be exposed to the public internet**. It assumes the
    client can already reach the host over a private network (Tailscale, WireGuard or
    LAN), and performs no TLS termination of its own (ADR-0001).

    Network reachability is not authorisation. Every request except `POST /v1/pair`
    carries a per-device bearer token with explicit scopes (ADR-0006).

    ## Reads are a stream; writes are RPCs

    Live state arrives over `GET /v1/stream`: a full snapshot as the first event, then
    deltas. Reconnecting yields a new full snapshot — there is no replay buffer, because
    the state is small and correctness beats bandwidth.

    `GET /v1/services` exists for cold start and for clients that cannot hold a stream
    open. Wear OS uses it exclusively: a held connection does not survive Doze, so
    nothing background-critical may depend on the stream.

    ## Actions are asynchronous

    Actions return `202 Accepted` with an action id; progress and terminal state arrive
    over the stream. This is not ceremony — it is forced by the platform. `RestartUnit`
    over D-Bus returns a *job* immediately and completes later, so the agent has no
    synchronous result to report even if it wanted one. Host power actions are worse
    still: a synchronous reboot response is never delivered, because the machine is
    gone. Both were confirmed empirically in M0; see `docs/m0-findings.md`.

    ## Capabilities

    Services advertise capabilities (`health`, `control`, and later `now_playing`,
    `transfers`, …) rather than being identified by type. Clients render per capability
    and must never branch on service id. Capability ids are public API: once
    `now_playing` ships it is a semantic contract shared by Jellyfin, Plex and Emby, not
    a reflection of any one service's data model (ADR-0005, ADR-0007).
  contact:
    name: CueSeek
    url: https://github.com/Kushal-MR/CueSeek
  license:
    name: TBD

servers:
  - url: http://{host}:{port}
    description: A cueseekd instance, reachable over a private network.
    variables:
      host:
        default: localhost
        description: Hostname or tailnet address of the server running cueseekd.
      port:
        default: "7777"

tags:
  - name: system
    description: Agent and host identity.
  - name: pairing
    description: Device enrolment and token issuance.
  - name: devices
    description: Paired device management and revocation.
  - name: services
    description: Managed services, their capabilities and their actions.
  - name: stream
    description: |
      Live state over SSE. Validated on a cellular tailnet (A7); see the endpoint
      description for the staleness handling every client must implement.

security:
  - deviceToken: []

paths:
  /v1/system:
    get:
      operationId: getSystem
      tags: [system]
      summary: Agent and host identity
      description: |
        Returns the agent version, the API version it implements, and the host's stable
        id and name.

        Clients need this before they can render anything else. The host id keys the
        client's multi-host data model (ADR-0008), and the version pair lets a client
        tell the user honestly when the *agent* is the outdated side of a version skew
        rather than the app (ADR-0007).
      x-required-scope: read
      responses:
        "200":
          description: System information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/pair:
    post:
      operationId: pairDevice
      tags: [pairing]
      summary: Redeem a pairing code for a device token
      description: |
        Exchanges a short-lived, single-use pairing code — displayed by the agent only
        when an operator explicitly runs `cueseekd pair` — for a long-lived per-device
        token.

        The token is returned **once** and is never recoverable: the agent stores only
        its hash. Redemption is rate-limited with backoff, because a short code is
        guessable given unlimited attempts (ADR-0006).

        This is the only unauthenticated operation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairRequest" }
      responses:
        "201":
          description: Device paired. The token is shown here and never again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: |
            The pairing code is invalid, expired, or already redeemed. Deliberately
            indistinguishable — telling a caller which of the three would help them
            enumerate.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List paired devices
      x-required-scope: read
      responses:
        "200":
          description: All paired devices.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a device
      description: |
        Revocation is immediate and affects only this device. Losing a phone means
        deleting one row, not rotating a secret shared by every client — which is the
        whole reason per-device tokens exist rather than a single API key.

        Requires the `devices.manage` scope, which is deliberately separate from
        `service.control`. Revocation is the most destructive operation in this API: it
        can lock every remaining device out of the agent, including the one an operator
        would use to undo the mistake. Folding it into the scope a smartwatch routinely
        carries would mean any device able to restart Jellyfin could also lock out the
        phone.

        A device may revoke itself. That is how a client logs out, and the audit log
        records it like any other revocation.
      x-required-scope: devices.manage
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204": { description: Device revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/services:
    get:
      operationId: listServices
      tags: [services]
      summary: All managed services with capabilities and health
      description: |
        Cold-start and polling equivalent of the stream's first snapshot. Wear OS uses
        this exclusively (ADR-0004).
      x-required-scope: read
      responses:
        "200":
          description: All managed services.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/refresh:
    post:
      operationId: requestRefresh
      tags: [services]
      summary: Ask the agent to observe every service now
      description: |
        Nudges the poller. The agent re-observes each service ahead of its next tick and
        publishes what it finds over the stream as ordinary `service_updated` events.

        **This returns before any of that happens, and that is deliberate.** The agent
        never lets a request wait on an upstream service, so a Jellyfin that has stopped
        answering delays nothing here (ADR-0003 Amendment 1). A `202` means the request
        was accepted, not that anything has been observed yet — watch the stream, or read
        `/v1/services` a moment later, for the result.

        Exists because re-reading a cache is not verification. An operator who has just
        stopped a service and wants to confirm it needs the agent to *look*, not to repeat
        what it last saw.

        Nudges are rate-bounded per service and conflated, so calling this in a loop
        costs the upstream service no more than calling it once.
      x-required-scope: read
      responses:
        "202":
          description: |
            Accepted. Nothing has necessarily been observed yet. Services already polled
            within the rate bound are left alone, so this is also the response when every
            nudge was dropped — the distinction is not one a client can act on.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/services/{serviceId}:
    get:
      operationId: getService
      tags: [services]
      summary: One managed service
      x-required-scope: read
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/services/{serviceId}/actions/{actionId}:
    post:
      operationId: invokeServiceAction
      tags: [services]
      summary: Invoke an action on a service
      description: |
        Accepts the action and returns immediately with an action id. Progress and
        terminal state arrive over the stream.

        The agent cannot report a synchronous result: `RestartUnit` returns a systemd
        *job* that completes later, and M0 confirmed that a `rc=0` return means only
        that the job was enqueued (`docs/m0-findings.md`).

        Requires the `service.control` scope. Scope enforcement happens here, in the
        agent — client-side confirmation prompts are user experience, not a control.
      x-required-scope: service.control
      parameters:
        - $ref: "#/components/parameters/ServiceId"
        - $ref: "#/components/parameters/ActionId"
      responses:
        "202":
          description: Action accepted. Watch the stream for its outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The action is not currently possible, e.g. already in progress.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/stream:
    get:
      operationId: streamEvents
      tags: [stream]
      summary: Live state as a stream of events
      description: |
        Emits a `snapshot` event on connect, then `service_updated`, `action_progress`
        and periodic `heartbeat` events. Reconnecting yields a new full snapshot; there
        is no `Last-Event-ID` replay buffer.

        ## Clients must not trust the connection state

        Assumption A7 was measured on a real phone over a cellular tailnet
        (`docs/m0-findings.md`). Foreground behaviour was flawless. With the screen off,
        the stream did **not** disconnect: Android froze the radio and the connection
        went silent for up to 168 seconds while still reporting itself as connected,
        then delivered everything in a burst on wake.

        A client that believes "connected" therefore shows data minutes old with no
        indication anything is wrong. Every consumer of this endpoint **must**:

        - treat state as stale when no event has arrived within roughly twice the
          heartbeat interval, whatever the transport claims, and render `unknown`
          (ADR-0008) rather than the last known values;
        - reconnect on its own schedule rather than waiting to be told to.

        Nothing background-critical may depend on this stream. Alerting is a separate
        problem with a separate answer (ADR-0012).

        The event payloads are defined as standalone components rather than inline, so
        that a future change of framing — to WebSocket, or to a `since`-parameterised
        poll — carries every payload schema, and therefore every generated client type,
        across unchanged. The envelope's `schema_version` is versioned independently of
        the URL path for the same reason: old Wear builds outlive refactors.
      x-required-scope: read
      responses:
        "200":
          description: |
            An event stream. Each SSE `data:` field contains one `StreamEnvelope`
            encoded as JSON.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: |
        A per-device token issued at pairing time. Tokens are stored by the agent as
        hashes only, are individually revocable, and carry independent scopes:

        | Scope | Grants |
        | --- | --- |
        | `read` | Read state: system, devices, services, the stream. |
        | `service.control` | Invoke service actions, e.g. restart Jellyfin. |
        | `devices.manage` | Revoke paired devices. |
        | `host.power` | Reboot or shut down the machine. |

        Scopes are separate grants, not tiers, and the set is chosen so that the
        dangerous powers can be withheld individually. A paired watch is typically issued
        `read` and `service.control` only: it can restart Jellyfin, but is structurally
        incapable of powering off the server or of locking other devices out — regardless
        of what its UI offers.

        The scope each operation requires is given by `x-required-scope`. It is an
        extension rather than a formal OpenAPI construct because scopes are only modelled
        natively for OAuth2 and OpenID Connect, and neither applies here (ADR-0006).

  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Opaque device identifier.
      schema: { type: string }
    ServiceId:
      name: serviceId
      in: path
      required: true
      description: Stable service identifier, e.g. `jellyfin`.
      schema: { type: string }
    ActionId:
      name: actionId
      in: path
      required: true
      description: Action identifier as advertised in the service's `actions` list.
      schema: { type: string }

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, invalid or revoked token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The token is valid but lacks the scope this operation requires.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited. Retry after backoff.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ---------------------------------------------------------------- errors
    Problem:
      type: object
      description: |
        Error payload following RFC 9457 (problem+json). One error shape across the whole
        API means clients write one error mapper rather than one per endpoint.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          example: "https://cueseek.dev/problems/insufficient-scope"
        title:
          type: string
          description: Short, human-readable summary. Stable for a given type.
          example: "Insufficient scope"
        status:
          type: integer
          description: HTTP status code.
          example: 403
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying this specific occurrence.

    # ---------------------------------------------------------------- system
    System:
      type: object
      required: [host_id, hostname, agent_version, api_version, started_at]
      properties:
        host_id:
          type: string
          description: |
            Stable, opaque identifier for this host. Clients key their multi-host data
            model on it, so it must survive restarts, hostname changes and IP changes
            (ADR-0008).
        hostname:
          type: string
          description: Human-readable host name, for display only. May change.
        agent_version:
          type: string
          description: Version of cueseekd.
          example: "0.1.0"
        api_version:
          type: string
          description: |
            Version of this contract that the agent implements. Lets a client report
            that the agent is behind, rather than silently mis-rendering.
          example: "0.1.0"
        started_at:
          type: string
          format: date-time
          description: When the agent process started.

    # --------------------------------------------------------------- pairing
    Scope:
      type: string
      description: An independently grantable permission.
      enum: [read, service.control, devices.manage, host.power]

    Platform:
      type: string
      description: Client platform, recorded for display in the device list.
      enum: [android, wearos, ios, web, desktop, cli, unknown]

    PairRequest:
      type: object
      required: [code, device_name, platform]
      properties:
        code:
          type: string
          description: The single-use pairing code displayed by the agent.
          example: "7F2K-90QX"
        device_name:
          type: string
          description: Human-readable name shown in the device list.
          example: "Pixel 8"
          maxLength: 64
        platform: { $ref: "#/components/schemas/Platform" }

    PairResponse:
      type: object
      required: [token, device]
      properties:
        token:
          type: string
          description: |
            The bearer token. Returned once and never recoverable — the agent stores
            only its hash. Clients must persist it in platform-secure storage.
        device: { $ref: "#/components/schemas/Device" }

    Device:
      type: object
      required: [id, name, platform, scopes, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        created_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          description: Absent if the device has not made a request since pairing.

    # ---------------------------------------------------------------- health
    HealthStatus:
      type: string
      description: |
        A closed set, shared by the API, both clients and the design system's status
        language. Adding a fifth value is a contract change, not an implementation
        detail (ADR-0008, ADR-0010).

        `unknown` is a real state, not an error: before the first poll completes, and
        whenever cached state has aged past tolerance, the honest answer is "I don't
        know". Showing stale green while the agent cannot reach a service is worse than
        showing nothing, because it is confidently wrong.
      enum: [healthy, degraded, unreachable, unknown]

    HealthReason:
      type: object
      description: |
        Why a service is in its current state. "Degraded" alone is not actionable;
        "degraded: unreachable for 4m" is, and it is also what a notification would say.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable identifier, safe to branch on.
          example: "unreachable"
        message:
          type: string
          description: Human-readable explanation.
          example: "No response for 4m12s"

    Health:
      type: object
      required: [status, reachable, observed_at, reasons]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        reachable:
          type: boolean
          description: |
            Whether the agent could reach the service at `observed_at`.

            Deliberately separate from `status` and from `reported_status`. "We could not
            reach qBittorrent" and "qBittorrent reports itself degraded" are different
            facts, and a console that conflates them lies to its operator (ADR-0005).
        reported_status:
          type: string
          description: |
            What the service says about itself, verbatim and unmapped. Absent when the
            service was unreachable or reports nothing.
        reasons:
          type: array
          items: { $ref: "#/components/schemas/HealthReason" }
        observed_at:
          type: string
          format: date-time
          description: |
            When this state was actually observed — not when it was served. Clients
            render staleness from this rather than presenting cached data as current.

    # -------------------------------------------------------------- services
    Capability:
      type: object
      description: |
        A capability a service supports. Clients hold a map of capability id to renderer
        and look it up; they must never branch on service id (ADR-0007).
      required: [id, label]
      properties:
        id:
          type: string
          description: |
            Stable capability identifier. Not an enum: capabilities are added by agent
            updates, and a client must tolerate ids it has never heard of.

            In use today: `health`, `control`, `web_ui`, `now_playing`, `transfers`.
          example: "now_playing"
        label:
          type: string
          description: |
            Human-readable name. Exists so a client that predates a capability can render
            "Immich Jobs — update CueSeek to view this" rather than an empty box.
          example: "Now Playing"

    ActionRisk:
      type: string
      description: |
        How much care an action warrants. Clients gate on this without knowing what the
        action does — which is what lets a new action ship to an existing client with a
        confirmation prompt already attached.
      enum: [safe, disruptive, destructive]

    WebUI:
      type: object
      description: |
        Where a service's own interface lives, as parts rather than as a URL.

        **The agent never sends a whole URL, and a client must never accept one.** The
        agent's own `base_url` for a service is a loopback address — it polls Jellyfin at
        127.0.0.1 because it runs on the same host — which is meaningless to a phone. The
        client already holds an address that reaches the host: the one it paired with. It
        composes `scheme://{paired host}:{port}{path}` from that.

        Two properties fall out of this. The same configuration works over a VPN and on the
        LAN, because the host part is whatever the client used to get here. And a
        compromised or buggy agent cannot redirect a client to an arbitrary origin, or hand
        back a `javascript:` URL, because it never supplies an origin at all.
      required: [scheme, port]
      properties:
        scheme:
          type: string
          enum: [http, https]
          description: |
            Almost always `http`: this is a service on the operator's own private network,
            and ADR-0001 delegates transport security to the VPN. `https` exists for
            deployments that terminate TLS locally.
          example: "http"
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The port the service's own interface listens on.
          example: 8096
        path:
          type: string
          description: |
            Path to open, including the leading slash. Defaults to `/`. Exists because a
            service may put its interface somewhere other than the root, and because a
            reverse proxy on the host may mount it under a prefix.
          default: "/"
          example: "/web/index.html"

    Action:
      type: object
      description: |
        An action descriptor. Actions are DATA, not enum cases — hardcoding an action
        list in a client discards capability discovery entirely (ADR-0005).
      required: [id, label, risk]
      properties:
        id: { type: string, example: "restart" }
        label: { type: string, example: "Restart Jellyfin" }
        risk: { $ref: "#/components/schemas/ActionRisk" }
        description:
          type: string
          description: Optional longer explanation, shown in a confirmation dialog.

    Service:
      type: object
      required: [id, name, capabilities, health, actions]
      properties:
        id:
          type: string
          description: Stable service identifier.
          example: "jellyfin"
        name:
          type: string
          description: Display name.
          example: "Jellyfin"
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        health: { $ref: "#/components/schemas/Health" }
        actions:
          type: array
          description: Empty if the service does not implement the `control` capability.
          items: { $ref: "#/components/schemas/Action" }
        web_ui:
          allOf: [{ $ref: "#/components/schemas/WebUI" }]
          description: |
            Absent unless the service advertises the `web_ui` capability. Same pairing as
            `control` and `actions`: the capability declares that something exists, the
            sibling field carries what a client needs to use it.
        now_playing:
          allOf: [{ $ref: "#/components/schemas/NowPlaying" }]
          description: |
            Absent unless the service advertises the `now_playing` capability. Same
            capability-plus-sibling pairing as `control` and `web_ui`.
        transfers:
          allOf: [{ $ref: "#/components/schemas/Transfers" }]
          description: |
            Absent unless the service advertises the `transfers` capability. Same
            capability-plus-sibling pairing as `control` and `web_ui`.

    # -------------------------------------------------------------- activity
    #
    # Two capabilities describing what a service is *doing* rather than whether it is up.
    #
    # Specified semantically rather than around whichever service was implemented first,
    # because ADR-0005 makes capability names public API: `now_playing` must fit Plex and
    # Emby as well as Jellyfin, and `transfers` must fit SABnzbd, Sonarr's queue and
    # Deluge as well as qBittorrent. Getting that wrong produces `now_playing_v2`.
    #
    # Both carry aggregate counts *and* a bounded sample of items, and the counts are the
    # truth. A server with four hundred torrents must not put four hundred objects on an
    # SSE frame every thirty seconds, so `items` is a sample for display while `active`
    # and `total` stay correct.
    #
    # Both stay inside the product rule: CueSeek reports that something is happening. It
    # does not pause a torrent or seek a stream. Those live in the service's own
    # interface, which is what `web_ui` exists to reach.

    NowPlaying:
      type: object
      description: |
        Active playback sessions on a media server.

        `transcoding` is broken out because it is the operationally significant fact on a
        self-hosted box: direct play costs almost nothing, and one 4K transcode can
        saturate the CPU everything else on the host shares. A console showing only a
        session count would hide the number that explains a hot machine.
      required: [sessions, transcoding, items]
      properties:
        sessions:
          type: integer
          minimum: 0
          description: Total active sessions. Authoritative, unlike the length of `items`.
          example: 2
        transcoding:
          type: integer
          minimum: 0
          description: How many of those sessions the server is transcoding.
          example: 1
        items:
          type: array
          description: |
            A bounded sample. May be shorter than `sessions`, and is empty when nothing
            is playing.
          items: { $ref: "#/components/schemas/PlaybackSession" }

    PlaybackSession:
      type: object
      required: [id, title, transcoding, paused]
      properties:
        id:
          type: string
          description: Stable within one observation. Not durable across restarts.
        title:
          type: string
          description: What is playing, as the server names it.
          example: "The Bear"
        subtitle:
          type: string
          description: |
            Context the title alone does not carry - an episode, an artist, a year.
            Absent when the service offers none; never synthesised by the agent.
          example: "S02E07"
        user:
          type: string
          description: Who is watching. Absent when the service does not say.
        client:
          type: string
          description: The app or device playing it, as the server reports it.
          example: "Android TV"
        position_seconds:
          type: integer
          minimum: 0
          description: Absent when the service reports no position.
        duration_seconds:
          type: integer
          minimum: 0
          description: Absent for live or unbounded content.
        paused:
          type: boolean
        transcoding:
          type: boolean
          description: |
            Whether the server is re-encoding this session. A boolean rather than
            Jellyfin's richer transcode reasons, which do not generalise.

    Transfers:
      type: object
      description: |
        In-flight transfers: torrents, usenet downloads, an import queue.

        Rates are bytes per second and are the service's own aggregate, never a sum over
        `items` - a sampled list would understate them.
      required: [active, total, download_rate_bytes, upload_rate_bytes, items]
      properties:
        active:
          type: integer
          minimum: 0
          description: Transfers currently moving data.
          example: 3
        total:
          type: integer
          minimum: 0
          description: |
            Transfers the service is tracking at all, including paused, queued, seeding
            and completed. Always at least `active`.
          example: 47
        download_rate_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Aggregate download rate, bytes per second.
        upload_rate_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Aggregate upload rate, bytes per second.
        items:
          type: array
          description: |
            A bounded sample, most active first. May be shorter than `total`, and is
            empty when the service is tracking nothing.
          items: { $ref: "#/components/schemas/TransferItem" }

    TransferItem:
      type: object
      required: [id, name, state, progress]
      properties:
        id:
          type: string
          description: The service's own identifier for this transfer.
        name:
          type: string
        state:
          type: string
          description: |
            The service's own state word, **verbatim and unmapped** - `downloading`,
            `stalledDL`, `seeding`, `queuedDL`, `pausedUP`. Deliberately not an enum:
            every service in this category has its own vocabulary, and flattening them
            into a shared one would discard the distinction between "stalled" and
            "queued" that tells an operator whether to care. Clients display it and must
            tolerate any value.
          example: "downloading"
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Fraction complete, 0 to 1.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Total size. Absent when the service does not report one.
        download_rate_bytes:
          type: integer
          format: int64
          minimum: 0
          description: This transfer's own rate, bytes per second.
        eta_seconds:
          type: integer
          minimum: 0
          description: |
            Absent when unknown or effectively infinite. A service reporting a
            placeholder like 8640000 must not have it passed through as eight years.

    # --------------------------------------------------------------- actions
    ActionStatus:
      type: string
      enum: [pending, running, succeeded, failed]

    ActionAccepted:
      type: object
      required: [action_id, service_id, action, status, accepted_at]
      properties:
        action_id:
          type: string
          description: Correlates this invocation with `action_progress` stream events.
        service_id: { type: string }
        action: { type: string }
        status: { $ref: "#/components/schemas/ActionStatus" }
        accepted_at: { type: string, format: date-time }

    ActionProgress:
      type: object
      required: [action_id, service_id, action, status, at]
      properties:
        action_id: { type: string }
        service_id: { type: string }
        action: { type: string }
        status: { $ref: "#/components/schemas/ActionStatus" }
        at: { type: string, format: date-time }
        error:
          type: string
          description: Present when `status` is `failed`.

    # ---------------------------------------------------------------- stream
    # These payloads are transport-agnostic ON PURPOSE. They are referenced by the SSE
    # endpoint today, but if A7 changes the transport they carry over unchanged.
    StreamEventType:
      type: string
      enum: [snapshot, service_updated, action_progress, heartbeat]

    StreamEnvelope:
      type: object
      description: |
        One event. `schema_version` is versioned independently of the URL path, because
        client releases and agent releases drift apart — a Wear build will routinely be
        older than the agent it talks to.
      required: [type, seq, emitted_at, schema_version]
      properties:
        type: { $ref: "#/components/schemas/StreamEventType" }
        seq:
          type: integer
          format: int64
          description: |
            Monotonic per connection, starting at 0 for the snapshot. Lets a client
            detect a gap. It is not a resume token — reconnecting yields a fresh
            snapshot and a reset sequence.
        emitted_at: { type: string, format: date-time }
        schema_version:
          type: string
          description: Version of the event payload schema.
          example: "1"
        snapshot: { $ref: "#/components/schemas/Snapshot" }
        service:
          allOf: [{ $ref: "#/components/schemas/Service" }]
          description: Present when `type` is `service_updated`.
        action_progress:
          allOf: [{ $ref: "#/components/schemas/ActionProgress" }]
          description: Present when `type` is `action_progress`.

    Snapshot:
      type: object
      description: |
        Complete current state. Sent as the first event on every connection, which is
        what removes the need for a replay buffer.
      required: [system, services]
      properties:
        system: { $ref: "#/components/schemas/System" }
        services:
          type: array
          items: { $ref: "#/components/schemas/Service" }
